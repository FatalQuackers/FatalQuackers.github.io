name: Update Roblox game stats

on:
  schedule:
    - cron: '17 */6 * * *'   # every 6 hours
  workflow_dispatch:          # "Run workflow" button on the Actions tab
  push:
    branches: [main]
    paths: ['data/games.config.json', 'scripts/fetch-games.mjs']

permissions:
  contents: write

concurrency:
  group: roblox-games
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch-games.mjs
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
      - name: Commit if changed
        run: |
          if git diff --quiet data/games.json; then echo "No changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/games.json
          git commit -m "Update Roblox game stats"
          git push
